# Default values for cloud-info
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

probes:
  readinessProbe:
    httpGet:
      path: /status
      port: 8000
    initialDelaySeconds: 25
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /status
      port: 8000
    initialDelaySeconds: 60
    periodSeconds: 10

global:
  autoscaling:
    enabled: false
  pdb:
    create: false
  loadbalancerURL: "https://test"
  commonAnnotations: {}
  commonLabels: {}
  ingress:
    enabled: false
    disableHostInIngress: false
    pathPrefix: ""
    pathType: ""
    className: harness
    hosts:
      - my-host.example.org
    tls:
      enabled: true
      secretName: ''
    objects:
      annotations: {}
  istio:
    enabled: false
    gateway:
      create: false
    virtualService:
      gateways:
      hosts:
# image pull secrets to use for every image
  imagePullSecrets: []

replicaCount: 1

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 100%
    maxUnavailable: 0

progressDeadlineSeconds: 600
terminationGracePeriodSeconds: 30


java:
  memory: "4096m"
  memoryLimit: "4096m"

image:
  registry: docker.io
  repository: harness/ce-cloud-info-signed
  pullPolicy: IfNotPresent
# Overrides the image tag whose default is the chart appVersion.
  tag: "10305"
  digest: ""
# image pull secrets to use for ce-cloud-info image
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: "harness-default"

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  annotations: {}
  type: ClusterIP
  port: 8082
  targetPort: 8000

virtualService:
  annotations: {}
  objects:
    - pathMatchType: prefix
      pathRewrite: "/"
      paths:
        - path: '{{ .Values.global.istio.virtualService.pathPrefix }}/ccm/public-pricing/'

ingress:
  annotations: {}
  className: nginx
  objects:
    - annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /$2
        nginx.ingress.kubernetes.io/use-regex: "true"
      paths:
      - path: '{{ .Values.global.ingress.pathPrefix }}/ccm/public-pricing(/|$)(.*)'

autoscaling:
  enabled: false
  targetCPU: 80
  targetMemory: ""

nodeSelector: {}

tolerations: []

affinity: {}

CLOUD_INFO_GCP_CREDS: ""

CLOUD_INFO_CONFIG: ""

proxy:
  httpsProxyEnabled: false
  httpsProxyUrl: http://localhost
  noProxyEnabled: false
  noProxyUrl: http://localhost

resources:
  limits:
    memory: "1536Mi"
  requests:
    cpu: "1536m"
    memory: "1536Mi"

# extraVolumes:
#   - name: volume-test
#     configMap:
#       name: test-config
#       # readOnly: true
extraVolumes: []

# extraVolumeMounts:
#   - name: volume-test
#     mountPath: /opt/harness/config
extraVolumeMounts: []

lifecycleHooks: {}
# lifecycleHooks:
#   postStart:
#     exec:
#       command:
#   preStop:
#     exec:
#       command:
secrets:
  fileSecret:
    - volumeMountPath: "/config"
      keys:
      - key: GCP_CREDENTIALS
        path: "gcp-creds.json"
      - key: CONFIG_FILE
        path: "config.toml"
  defaultSecretName: "cloud-info-secret-mount"
  default:
    GCP_CREDENTIALS: ""
    # Fallback configuration used ONLY when CONFIG_FILE is not supplied via an
    # external/kubernetes secret. Without a real value here the chart generates a
    # random dummy string, mounts it as /config/config.toml, and the service
    # crashes on startup while parsing it. This default lets the pod start with
    # scraping enabled, all providers disabled, and an in-memory store. The
    # management API stays unauthenticated unless a token is set below, so restrict
    # access to it with a NetworkPolicy (or set management.token) when relying on
    # this fallback.
    CONFIG_FILE: |
      environment = "production"
      debug = false
      shutdownTimeout = "5s"

      [config.vault]
      enabled = false
      address = ""
      token = ""
      secretPath = ""

      [log]
      format = "json"
      level = "info"

      [metrics]
      enabled = false
      address = ":9090"

      [jaeger]
      enabled = false

      # Configure either collectorEndpoint or agentEndpoint.
      # When both are configured collectorEndpoint will take precedence and the exporter will report directly to the collector.
      collectorEndpoint = "http://localhost:14268/api/traces?format=jaeger.thrift"
      agentEndpoint = "localhost:6831"
      # username = ""
      # password = ""

      [app]
      address = ":8000"
      basePath = "/"

      [scrape]
      enabled = true
      interval = "24h"

      [provider.amazon]
      enabled = false

      # See available regions in the documentation:
      # https://aws.amazon.com/about-aws/global-infrastructure/regions_az
      # region = "us-east-1"

      # Static credentials
      # accessKey = ""
      # secretKey = ""

      # Shared credentials
      # sharedCredentialsFile = ""
      # profile = ""

      # IAM Role ARN to assume
      # assumeRoleARN = ""

      # http address of a Prometheus instance that has AWS spot price metrics via banzaicloud/spot-price-exporter.
      # If empty, the cloudinfo app will use current spot prices queried directly from the AWS API.
      prometheusAddress = ""

      # advanced configuration: change the query used to query spot price info from Prometheus.
      prometheusQuery = "avg_over_time(aws_spot_current_price{region=\"%s\", product_description=\"Linux/UNIX\"}[1w])"

      # Amazon pricing API credentials (optional)
      # Falls back to the primary credentials.
      [provider.amazon.pricing]

      # See available regions in the documentation:
      # https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/using-pelong.html
      # region = "us-east-1"

      # Static credentials
      # accessKey = ""
      # secretKey = ""

      # Shared credentials
      # sharedCredentialsFile = ""
      # profile = ""

      # IAM Role ARN to assume
      # assumeRoleARN = ""

      [provider.google]
      enabled = false

      # base64 encoded credentials in json format (base64 encoded content of the credential file)
      # credentials = ""

      # credentialsFile = ""

      # project = ""

      [provider.alibaba]
      enabled = false

      # region = ""
      # accessKey = ""
      # secretKey = ""

      [provider.oracle]
      enabled = false

      # tenancy = ""
      # user = ""
      # region = ""
      # fingerprint = ""
      # privateKey = ""
      # privateKeyPassphrase = ""

      # configFilePath = ""
      # profile = ""

      [provider.azure]
      enabled = false

      # subscriptionId = ""

      # Client credentials
      # clientId = ""
      # clientSecret = ""
      # tenantId = ""

      [provider.digitalocean]
      enabled = false

      [provider.vsphere]
      enabled = false

      # accessToken = ""

      [management]
      enabled = true
      address = ":8001"
      # When set, callers must send this value in the "Token" header to access
      # /management/store/*. Empty means no authentication. Can also be provided via
      # the CLOUDINFO_MANAGEMENT_TOKEN environment variable (which overrides this).
      token = ""

      [pprof]
      # Required in the Token header to access /debug/pprof/*. Empty disables pprof.
      secret_token = ""

      [graphql]
      # Caps the total complexity of a single GraphQL query to mitigate
      # resource-exhaustion attacks. A value <= 0 disables the limit (the default).
      # Set a positive value (e.g. 200) to enable it. Can also be set via the
      # CLOUDINFO_GRAPHQL_COMPLEXITY_LIMIT environment variable.
      complexity_limit = 0

      [serviceloader]
      serviceConfigLocation = "./configs"
      serviceConfigName = "services"
      format = "yaml"

      [store.redis]
      enabled = false
      host = "localhost"
      port = 6379

      [store.cassandra]
      enabled = false
      hosts = "localhost"
      port = 9042
      keyspace = "cloudinfo"
      table = "products"

      [store.gocache]
      expiration = 0
      cleanupInterval = 0

      [store.modernredis]
      address = "localhost"
      password = ""
      db = 0
      enabled = false
      sentinelEnabled = false
      masterName = "master"
      masterPassword = ""
      sentinelAddress = ["127.0.0.1:26739"]
  kubernetesSecrets:
  - secretName: ""
    keys:
      GCP_CREDENTIALS: ""
      CONFIG_FILE: ""
  secretManagement:
    externalSecretsOperator:
    - secretStore:
        name: ""
        kind: ""
      remoteKeys:
        GCP_CREDENTIALS:
          name: ""
          property: ""
        CONFIG_FILE:
          name: ""
          property: ""

config:
  USE_WORKLOAD_IDENTITY: "false"
  CLOUDINFO_GRAPHQL_COMPLEXITY_LIMIT: "0"

rbac:
  rules: []

pdb:
  create: false
